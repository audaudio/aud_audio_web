name: aud_audio_web
description: "Web build of the Audanika Audio Engine: Emscripten toolchain, AudioWorklet host, Wasm Worker control runtime"
version: 0.0.3
publish_to: none
homepage: https://github.com/audaudio/aud_audio_web
repository: https://github.com/audaudio/aud_audio_web

environment:
  sdk: ^3.12.2

# Add regular dependencies here.
dependencies:
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.1.0
  aud_audio_io:
    git:
      url: git@github.com:audaudio/aud_audio_io.git
      tag_pattern: "{{version}}"
    version: ^0.1.0
  # path: ^1.9.0

dev_dependencies:
  dna_audanika: ^0.0.2
  helix: ^1.11.0
  lints: ^6.1.0
  test: ^1.32.0